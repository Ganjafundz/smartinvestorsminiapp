<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Investors</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .balance {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .balance h2 {
            margin: 0;
            color: #555;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .buttons {
            display: grid;
            gap: 15px;
        }

        button {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Smart Investors</h1>
        <p>Welcome to your dashboard</p>
    </div>

    <div class="container">

        <div class="balance">
            <h2>Total Balance</h2>
            <div class="amount">$0.00</div>
        </div>

        <div class="buttons">
            <button onclick="alert('Deposit section coming soon!')">💰 Deposit</button>
            <button>💸 Withdraw</button>
            <button>📊 Investments</button>
            <button>👤 Profile</button>
            <button>💬 Support</button>
        </div>

    </div>

</body>
</html>
